<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Complaints | ResolveHub</title>

    <!-- <link rel="stylesheet" href="all-complaints.css"> -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            background: #F5F7FB;
        }

        /* ================= Sidebar ================= */

        .sidebar {
            width: 250px;
            height: 100vh;
            background: #0A5CFF;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .logo i {
            font-size: 30px;
        }

        .logo h2 {
            font-size: 24px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
        }

        .sidebar ul li i {
            margin-right: 10px;
        }

        .sidebar ul li:hover,
        .sidebar ul li.active {
            background: white;
            color: #0A5CFF;
        }

        /* ================= Main ================= */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        /* ================= Header ================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        header h1 {
            color: #0A5CFF;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .top-right i {
            font-size: 22px;
            cursor: pointer;
        }

        .top-right img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        /* ================= Search ================= */

        .search-section {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-section input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-section select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-section button {
            background: #0A5CFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        .search-section button:hover {
            background: #0847CC;
        }

        /* ================= Cards ================= */

        .cards {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            border-top: 4px solid #0A5CFF;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card i {
            font-size: 30px;
            color: #0A5CFF;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 30px;
            color: #222;
        }

        .card p {
            margin-top: 8px;
            color: #666;
        }

        /* ================= Table ================= */

        .table-box {
            margin-top: 30px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title h2 {
            color: #0A5CFF;
        }

        .title button {
            background: #0A5CFF;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        .title button:hover {
            background: #0847CC;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: #0A5CFF;
            color: #fff;
            padding: 15px;
            font-size: 15px;
        }

        table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        table tr:hover {
            background: #F8FAFC;
        }

        /* ================= Status Badges ================= */

        .pending {
            background: #FFF3CD;
            color: #B45309;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .progress {
            background: #DBEAFE;
            color: #1D4ED8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .resolved {
            background: #DCFCE7;
            color: #15803D;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }



        /* ================= Action Button ================= */

        table button {
            background: #0A5CFF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        table button:hover {
            background: #0847CC;
        }

        .details {
            margin-top: 35px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        .details h2 {
            margin-bottom: 20px;
        }

        .details p {
            margin: 12px 0;
        }

        .details select {
            margin-top: 10px;
            width: 250px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* ================= Footer ================= */

        footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            padding: 20px 0;
        }

        /* ================= Responsive ================= */

        @media(max-width:1200px) {

            .cards {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media(max-width:900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-section {
                flex-direction: column;
            }

            .search-section input,
            .search-section select,
            .search-section button {
                width: 100%;
            }

            table {
                font-size: 14px;
            }

        }

        @media(max-width:768px) {

            .sidebar {
                width: 80px;
                padding: 15px;
            }

            .sidebar h2,
            .sidebar li {
                font-size: 0;
            }

            .sidebar i {
                font-size: 22px;
            }

            .main {
                margin-left: 80px;
                width: calc(100% - 80px);
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .title {
                flex-direction: column;
                gap: 15px;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 900px;
            }

        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
