<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complain Form</title>
    <script defer src="complainForm.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            margin: 0;
            height: 100vh;
            background-image: url(images/Complainbackground.png);
            background-repeat: no-repeat;
        }

        nav {
            width: 100vw;
            height: 60px;
            display: flex;
            justify-content: space-between;
            padding-right: 10px;
            align-items: center;
        }

        .left-nav {
            display: flex;
            padding-top: 5px;
            padding-left: 150px;
        }

        ul {
            list-style-type: none;
            align-items: center;
            display: flex;
            gap: 20px;
        }

        .container {
            background-color: white;
            width: 80%;
            height: 90%;
            display: grid;
            margin: auto;
            border-radius: 10px;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 1fr;
            grid-template-areas:
                "sideL main";
        }

        .sideL {
            grid-area: sideL;
            border-right: 2px solid gray;
            /* background-color: #eef2ff;; */
        }

        .main {
            grid-area: main;
            padding-left: 20px;
            padding-right: 10px;
        }

        /* ---------------------------------------------main------------------------------------------------------ */

        .icon-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: auto;
            background-color: #eef2ff;
            color: #3b82f6;
        }

        .content {
            padding-left: 40px;
        }

        .content h1 {
            color: #0f172a;
            margin-top: 20px;
        }

        .content h1 span {
            display: block;
            color: #35b729;
        }

        .line {

            width: 70px;
            height: 4px;

            background: #0052cc;

            margin: 25px;

            border-radius: 20px;

        }

        .content p {
            width: 200px;
            padding-top: 10px;
            color: #555;

            line-height: 1.8;

            margin-bottom: 10px;

        }

        .container img {
            width: 200px;
            height: 300px;
        }

        .box1 {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            /* justify-content: space-between; */
        }

        .input-box {
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        .input-box input,
        .input-box select,
        .input-box textarea {

            padding: 15px;

            border: 2px solid #dbe6ff;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: .3s;

        }

        .input-box input:focus,
        .input-box textarea:focus,
        .input-box select:focus {

            border-color: #0052cc;

            box-shadow: 0 0 10px rgba(0, 82, 204, .15);

        }

        .input-box label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }

        .input-box textarea {
            resize: none;
            border-radius: 5px;
        }

        /* Upload */

        .upload {

            margin-top: 10px;
            border: 2px dashed #9ec1ff;
            border-radius: 18px;
            padding-bottom: 5px;
            text-align: center;

        }

        .upload p {
            color: #666;
            margin: 5px 0;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 10px;

        }

        .buttons button {
            padding: 10px 35px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        .reset {
            background: #edf2ff;
            color: #0052cc;
        }

        .sunmit {
            background: #0052cc;
            color: white;
        }

        .submit:hover {
            background: #003e99;
        }

        .reset:hover {
            background: #d8e7ff;
        }


        /* Responsive */

        @media(max-width:1100px) {

            body {
                background-image: none;
                background-color: white;
            }

            .left-nav {
                padding: 0;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .sideL {
                display: none;
            }

            .box1 {
                flex-direction: column;
            }


        }
    </style>
</head>

<body>
    <nav>
        <div class="left-nav">
            <ul>
                <li><svg width="250" height="200" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">

                        <defs>
                            <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#0A5CFF" />
                                <stop offset="100%" stop-color="#22B5FF" />
                            </linearGradient>

                            <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#7ED321" />
                                <stop offset="100%" stop-color="#A4E635" />
                            </linearGradient>
                        </defs>

                        <!-- Chat Bubble Circle -->
                        <circle cx="120" cy="120" r="80" fill="url(#blueGrad)" />

                        <!-- Chat Tail -->
                        <path d="M140 180 L170 220 L120 200 Z" fill="url(#blueGrad)" />

                        <!-- Green Sweep -->
                        <path d="M25 150
                            C40 200 100 220 150 195
                            C100 205 60 180 40 130 Z" fill="url(#greenGrad)" />

                        <!-- Monitor -->
                        <rect x="70" y="80" width="90" height="65" rx="5" fill="none" stroke="#001F54"
                            stroke-width="8" />

                        <line x1="115" y1="145" x2="115" y2="160" stroke="#001F54" stroke-width="8" />

                        <line x1="90" y1="160" x2="140" y2="160" stroke="#001F54" stroke-width="8" />

                        <!-- Check Arrow -->
                        <path d="M95 110
                                L120 135
                                L200 55" fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"
                            stroke-linejoin="round" />

                        <!-- Arrow Head -->
                        <polygon points="190,45 220,50 205,75" fill="#9AE62E" />

                        <!-- Text -->
                        <text x="250" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700"
                            fill="#0052CC">
                            Resolve<tspan fill="#8BCF2F">Hub</tspan>
                        </text>

                        <text x="252" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#8A8A8A">
                            Smart Complaint Management Portal
                        </text>

                    </svg>
                </li>
            </ul>
        </div>

        <div class="right-nav">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">New Complain</a></li>
                <li><a href="/profile">Ankit Dhakad </a></li>
            </ul>
        </div>
    </nav>


    <div class="container">

        <div class="sideL">

            <div class="icon-wrapper">
            </div>

            <div class="content">

                <h1>
                    File a New
                    <span>Complaint</span>
                </h1>

                <div class="line"></div>
                <P>
                    Help us make things better.
                    provide the details of your issue so we can take the right action
                </P>

                <img src="images/complainImage1.jpeg" alt="checklistLogo">
            </div>

        </div>

        <div class="main">
            <h2>Complaint Details</h2>
            <p>Please provide the accurate information about your issue</p>

            <form action="submit" class="complainForm">

                <div class="box1">

                    <div class="input-box">
                        <label for="category">Complaint Category</label>
                        <select id="category">
                            <option value="">--Select Category--</option>
                            <option value="Water">Water</option>
                            <option value="Electricity">Electricity</option>
                            <option value="Road">Road</option>
                            <option value="Pollution">Pollution</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="type">Complaint type</label>
                        <select id="type">
                            <option value="">--Select type--</option>
                            <option value="Urgent">Urgent>
                            <option value="Normal">Normal</option>
                        </select>
                    </div>

                </div>

                <div class="input-box">
                    <label>Tittle / Subject</label>
                    <input type="text" id="tittle" placeholder="Enter a short tittle for your Complaint">
                </div>

                <div class="input-box">
                    <label>Description</label>
                    <textarea id="Description" rows="5" placeholder="Please describe your issue in details"></textarea>
                </div>

                <div class="box1">

                    <div class="input-box" aria-required="true">
                        <label for="category">Location</label>
                        <input type="text" id="Location">
                    </div>

                    <div class="input-box">
                        <label for="type">Date of Incident</label>
                        <input id="date" type="date">
                    </div>

                    <div class="input-box">
                        <label for="type">Time(Optional)</label>
                        <input id="Time" type="time">
                    </div>

                </div>


                <div>
                    <label>
                        <h3> upload Attachement</h3>
                    </label>
                    <div class="upload">
                        <p> JPEG, PNG, PDF (MAX 5MB)</p>
                        <input type="file" name="" id="">
                    </div>
                </div>

                <div class="buttons">
                    <button class="reset"> Reset</button>
                    <button class="submit"> Submit Complaint</button>
                </div>

            </form>


        </div>
    </div>



</body>

</html>
