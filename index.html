<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Complain Management Portol</title>
</head>

<body>
    <div class="container">

        <!-- NAV-BAR -->
        <div class="nav">
            <div class="left-nav">
                <ul>
                    <li><svg width="250" height="200" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">

                            <defs>
                                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#0A5CFF" />
                                    <stop offset="100%" stop-color="#22B5FF" />
                                </linearGradient>

                                <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#7ED321" />
                                    <stop offset="100%" stop-color="#A4E635" />
                                </linearGradient>
                            </defs>

                            <!-- Chat Bubble Circle -->
                            <circle cx="120" cy="120" r="80" fill="url(#blueGrad)" />

                            <!-- Chat Tail -->
                            <path d="M140 180 L170 220 L120 200 Z" fill="url(#blueGrad)" />

                            <!-- Green Sweep -->
                            <path d="M25 150
                            C40 200 100 220 150 195
                            C100 205 60 180 40 130 Z" fill="url(#greenGrad)" />

                            <!-- Monitor -->
                            <rect x="70" y="80" width="90" height="65" rx="5" fill="none" stroke="#001F54"
                                stroke-width="8" />

                            <line x1="115" y1="145" x2="115" y2="160" stroke="#001F54" stroke-width="8" />

                            <line x1="90" y1="160" x2="140" y2="160" stroke="#001F54" stroke-width="8" />

                            <!-- Check Arrow -->
                            <path d="M95 110
                                L120 135
                                L200 55" fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"
                                stroke-linejoin="round" />

                            <!-- Arrow Head -->
                            <polygon points="190,45 220,50 205,75" fill="#9AE62E" />

                            <!-- Text -->
                            <text x="250" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="72"
                                font-weight="700" fill="#0052CC">
                                Resolve<tspan fill="#8BCF2F">Hub</tspan>
                            </text>

                            <text x="252" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="28"
                                fill="#8A8A8A">
                                Smart Complaint Management Portal
                            </text>

                        </svg>
                    </li>
                </ul>
            </div>

            <div class="middle-nav">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/services">Services</a></li>
                    <li><a href="/track">Track Complaint</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                </ul>
            </div>

            <div class="right-nav">
                <button>Login</button>
                <button>Register</button>
            </div>
        </div>

        <!-- MAIN-CONTENT -->
        <div class="main">

            <section class="hero-section">

                <div class="hero-content">
                    <h1>Complaint<br>Management Portal</h1>
                    <p>A platform to register your complain and track their status on real time.</p>

                    <div class="btn-group">
                        <a href="#" class="btn ">
                            <span>👤</span>
                            Submit Complaint
                        </a>
                        <a href="#" class="btn">
                            <span>🔍</span>
                            Submit Complaint
                        </a>
                    </div>
                </div>

                <div class="illustration-section">
                    <img src="img.jpeg" alt="Management Illustration" class="img-placeholder">
                </div>

            </section>


        </div>
        <div class="footer"></div>
    </div>
</body>

</html>
